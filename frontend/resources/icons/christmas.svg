<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- Fitrix app icon "christmas", drawn by hand like "halloween" (scripts/app-icons.mjs renders it,
       it does not write it). The plates are the Fitrix mark of resources/icon.svg in lime, on a
       winter night: a Santa hat on the dot, the bottom plate wrapped as a present with a red
       ribbon and a bow, snowflakes around. Only rect, circle, line, polyline, polygon and one
       radialGradient: what the script knows how to draw. -->
  <defs>
    <radialGradient id="night" gradientUnits="userSpaceOnUse" cx="256" cy="300" r="380">
      <stop offset="0" stop-color="#22356a"/>
      <stop offset="1" stop-color="#070b16"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#night)"/>
  <!-- Everything that matters stays within 228 of the centre: Android cuts the art to a circle and
       only promises the middle 66 dp of its 72, and iOS rounds the corners off. -->
  <!-- snowflakes: six arms each, a little V on every arm -->
  <g stroke="#dbe9ff" stroke-width="6">
    <line x1="120.0" y1="84.0" x2="120.0" y2="140.0"/>
    <line x1="120.0" y1="133.0" x2="115.0" y2="139.0"/>
    <line x1="120.0" y1="133.0" x2="125.0" y2="139.0"/>
    <line x1="120.0" y1="91.0" x2="125.0" y2="85.0"/>
    <line x1="120.0" y1="91.0" x2="115.0" y2="85.0"/>
    <line x1="144.2" y1="98.0" x2="95.8" y2="126.0"/>
    <line x1="101.8" y1="122.5" x2="94.1" y2="121.1"/>
    <line x1="101.8" y1="122.5" x2="99.1" y2="129.9"/>
    <line x1="138.2" y1="101.5" x2="145.9" y2="102.9"/>
    <line x1="138.2" y1="101.5" x2="140.9" y2="94.1"/>
    <line x1="144.2" y1="126.0" x2="95.8" y2="98.0"/>
    <line x1="101.8" y1="101.5" x2="99.1" y2="94.1"/>
    <line x1="101.8" y1="101.5" x2="94.1" y2="102.9"/>
    <line x1="138.2" y1="122.5" x2="140.9" y2="129.9"/>
    <line x1="138.2" y1="122.5" x2="145.9" y2="121.1"/>
  </g>
  <g stroke="#dbe9ff" stroke-width="5">
    <line x1="398.0" y1="108.0" x2="398.0" y2="148.0"/>
    <line x1="398.0" y1="143.0" x2="394.4" y2="147.3"/>
    <line x1="398.0" y1="143.0" x2="401.6" y2="147.3"/>
    <line x1="398.0" y1="113.0" x2="401.6" y2="108.7"/>
    <line x1="398.0" y1="113.0" x2="394.4" y2="108.7"/>
    <line x1="415.3" y1="118.0" x2="380.7" y2="138.0"/>
    <line x1="385.0" y1="135.5" x2="379.5" y2="134.5"/>
    <line x1="385.0" y1="135.5" x2="383.1" y2="140.8"/>
    <line x1="411.0" y1="120.5" x2="416.5" y2="121.5"/>
    <line x1="411.0" y1="120.5" x2="412.9" y2="115.2"/>
    <line x1="415.3" y1="138.0" x2="380.7" y2="118.0"/>
    <line x1="385.0" y1="120.5" x2="383.1" y2="115.2"/>
    <line x1="385.0" y1="120.5" x2="379.5" y2="121.5"/>
    <line x1="411.0" y1="135.5" x2="412.9" y2="140.8"/>
    <line x1="411.0" y1="135.5" x2="416.5" y2="134.5"/>
