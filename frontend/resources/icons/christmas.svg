    <line x1="420.0" y1="309.5" x2="416.8" y2="313.4"/>
    <line x1="420.0" y1="309.5" x2="423.2" y2="313.4"/>
    <line x1="420.0" y1="282.5" x2="423.2" y2="278.6"/>
    <line x1="420.0" y1="282.5" x2="416.8" y2="278.6"/>
    <line x1="435.6" y1="287.0" x2="404.4" y2="305.0"/>
    <line x1="408.3" y1="302.8" x2="403.3" y2="301.9"/>
    <line x1="408.3" y1="302.8" x2="406.6" y2="307.5"/>
    <line x1="431.7" y1="289.2" x2="436.7" y2="290.1"/>
    <line x1="431.7" y1="289.2" x2="433.4" y2="284.5"/>
    <line x1="435.6" y1="305.0" x2="404.4" y2="287.0"/>
    <line x1="408.3" y1="289.2" x2="406.6" y2="284.5"/>
    <line x1="408.3" y1="289.2" x2="403.3" y2="290.1"/>
    <line x1="431.7" y1="302.8" x2="433.4" y2="307.5"/>
    <line x1="431.7" y1="302.8" x2="436.7" y2="301.9"/>
  </g>
  <!-- loose snow -->
  <g fill="#dbe9ff">
    <circle cx="176" cy="72" r="4"/>
    <circle cx="344" cy="76" r="5"/>
    <circle cx="84" cy="196" r="4"/>
    <circle cx="436" cy="200" r="5"/>
    <circle cx="142" cy="436" r="4"/>
    <circle cx="372" cy="440" r="4"/>
    <circle cx="256" cy="448" r="3"/>
  </g>
  <!-- the Fitrix plates, lime -->
  <g fill="#a3e635">
    <rect x="112.0" y="346.0" width="288.0" height="63" rx="31.5"/>
    <rect x="157.0" y="265.0" width="198.0" height="63" rx="31.5"/>
    <rect x="202.0" y="184.0" width="108.0" height="63" rx="31.5"/>
    <circle cx="256.0" cy="130.0" r="27"/>
  </g>
  <!-- the bottom plate wrapped as a present: a ribbon down it and a bow on the left of the plate -->
  <g fill="#e63946">
    <rect x="249" y="346" width="14" height="63"/>
    <polygon points="256,346 224,326 226,364"/>
    <polygon points="256,346 288,326 286,364"/>
  </g>
  <circle cx="256" cy="346" r="9" fill="#b5202c"/>
  <!-- the Santa hat on the dot, its tip flopped over to the right -->
  <polygon points="231,124 281,124 304,74" fill="#e63946"/>
  <circle cx="306" cy="72" r="12" fill="#f8f9fa"/>
  <g fill="#f8f9fa">
    <rect x="226" y="116" width="60" height="20"/>
    <circle cx="226" cy="126" r="10"/>
    <circle cx="286" cy="126" r="10"/>
  </g>
</svg>
